name: Release readiness

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-metadata:
    name: Android, ABI, and publication metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Test Android hosts and verify stable API/POMs
        run: |
          ./gradlew \
            :admob-cmp-core:testAndroidHostTest \
            :admob-cmp-compose:testAndroidHostTest \
            :admob-cmp:verifyKotlinMultiplatformPomDependencyScopes \
            :admob-cmp-compose:verifyKotlinMultiplatformPomDependencyScopes \
            :androidApp:assembleDebug \
            --no-configuration-cache

      - name: Verify all three modules enter the Central task graph
        run: ./gradlew publishToMavenCentral --dry-run --no-configuration-cache

  ios-and-published-consumer:
    name: iOS and published facade consumer
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Assert Xcode 26 (iOS Simulator SDK 26)
        run: xcodebuild -showsdks | grep -q "iphonesimulator26" || { echo "SDK 26 not found"; xcodebuild -showsdks; exit 1; }

      - name: Test iOS SDK targets and verify klib ABI
        run: |
          ./gradlew \
            :admob-cmp-core:iosSimulatorArm64Test \
            :admob-cmp-compose:iosSimulatorArm64Test \
            :admob-cmp-core:checkKotlinAbi \
            :admob-cmp-compose:checkKotlinAbi \
            --no-configuration-cache

      - name: Publish all SDK modules locally
        run: ./gradlew publishToMavenLocal -PsignAllPublications=false --no-configuration-cache

      - name: Compile Android and iOS using only the published facade
        run: |
          ./gradlew \
            :shared:compileAndroidMain \
            :shared:compileKotlinIosSimulatorArm64 \
            -PadmobCmpConsumePublished=true \
            --refresh-dependencies \
            --no-configuration-cache

      - name: Build the real iOS Xcode consumer
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
