name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Assert Xcode 26 (iOS Simulator SDK 26)
        run: xcodebuild -showsdks | grep -q "iphonesimulator26" || { echo "SDK 26 not found"; xcodebuild -showsdks; exit 1; }

      - name: Publish to Maven Central
        run: ./admob-cmp/scripts/publish-maven-central.sh
        env:
          # We check a few common secret naming conventions you might have used:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME || secrets.ORG_GRADLE_PROJECT_mavenCentralUsername || secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD || secrets.ORG_GRADLE_PROJECT_mavenCentralPassword || secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY || secrets.ORG_GRADLE_PROJECT_signingInMemoryKey || secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD || secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword || secrets.GPG_PASSWORD }}
